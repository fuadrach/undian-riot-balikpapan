<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0f45"/>
      <stop offset=".5" stop-color="#8b2c7a"/>
      <stop offset="1" stop-color="#ff5f6d"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset=".45" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff5f6d"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity=".6"/>
      <stop offset="1" stop-color="#190a2c"/>
    </linearGradient>
    <clipPath id="clip"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="64" height="64" fill="url(#sky)"/>

    <!-- bintang -->
    <g fill="#fff4e6" opacity=".8">
      <circle cx="12" cy="10" r="1"/>
      <circle cx="52" cy="8" r="1.2"/>
      <circle cx="44" cy="16" r=".8"/>
      <circle cx="19" cy="19" r=".8"/>
    </g>

    <!-- matahari terbenam -->
    <circle cx="32" cy="39" r="18" fill="url(#sun)"/>
    <g fill="#2a0f45" opacity=".5">
      <rect x="6" y="34.5" width="52" height="1.8"/>
      <rect x="6" y="39.5" width="52" height="2.4"/>
      <rect x="6" y="45" width="52" height="3"/>
    </g>

    <!-- laut -->
    <rect y="49" width="64" height="15" fill="url(#sea)"/>
    <g fill="#ffd479" opacity=".6">
      <rect x="26" y="52.5" width="12" height="1.4" rx=".7"/>
      <rect x="19" y="56.5" width="26" height="1.2" rx=".6"/>
      <rect x="28" y="60.5" width="8" height="1" rx=".5"/>
    </g>
  </g>
</svg>
