name: Unggah ke hosting (FTP)

# Setiap push ke main dikirim ke hosting InfinityFree.
# Kredensial diambil dari GitHub Secrets — tidak pernah ditulis di berkas ini.
on:
  push:
    branches: [main]
  workflow_dispatch:        # bisa juga dijalankan manual dari tab Actions

jobs:
  unggah:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Kirim lewat FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          # folder tujuan di hosting; htdocs = root web InfinityFree
          server-dir: htdocs/undian/
          # JANGAN sentuh data acara & berkas milik git
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/data/**
            **/README.md
